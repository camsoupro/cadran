<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Cadran">
  <!-- Le cadran : un cercle, quatre reperes, une aiguille cuivre et son ombre.
       Le cercle prend la couleur du texte autour, l'aiguille garde le cuivre. -->
